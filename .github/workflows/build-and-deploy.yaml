name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "analytics/**"
      - "auth/**"
      - "charm/**"
      - "migrations/**"
      - "static/**"
      - "templates/**"
      - "app.py"
      - "config.py"
      - "models.py"
      - "migrate.py"
      - "requirements.txt"
      - "rockcraft.yaml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "docker-compose.yaml"

env:
  CHARM_NAME: marketplace-analytics
  CHANNEL: latest/edge
  JAAS_CONTROLLER: jaas.ps7.canonical.com:443/k8s-jaas-ps7-jimm-jimm
  JUJU_MODEL: 795798e4-922f-49c7-9169-004ffc17df90@serviceaccount/k8s-stg-marketplace-marketplace-analytics

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  pack-and-publish:
    uses: ./.github/workflows/pack-and-publish.yaml
    with:
      charm_name: marketplace-analytics
      channel: latest/edge
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}

  deploy:
    name: Deploy to PS7
    runs-on: ubuntu-latest
    needs: pack-and-publish
    steps:
      - name: Install Juju
        run: sudo snap install juju --classic --channel=3/stable

      - name: Login to JAAS
        env:
          JUJU_CLIENT_ID: ${{ secrets.JUJU_CLIENT_ID }}
          JUJU_CLIENT_SECRET: ${{ secrets.JUJU_CLIENT_SECRET }}
        run: juju login ${{ env.JAAS_CONTROLLER }} -c jaas-ps7

      - name: Refresh charm
        env:
          JUJU_CLIENT_ID: ${{ secrets.JUJU_CLIENT_ID }}
          JUJU_CLIENT_SECRET: ${{ secrets.JUJU_CLIENT_SECRET }}
        run: juju refresh ${{ env.CHARM_NAME }} --channel=${{ env.CHANNEL }} -m ${{ env.JUJU_MODEL }}
