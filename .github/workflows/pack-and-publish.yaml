name: Pack and Publish

on:
  workflow_call:
    inputs:
      charm_name:
        required: true
        type: string
      channel:
        required: true
        type: string

    secrets:
      CHARMHUB_TOKEN:
        required: true

jobs:
  setup:
    name: Check for charm changes
    runs-on: ubuntu-latest
    outputs:
      charm_changed: ${{ steps.check.outputs.charm_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for charm/ changes
        id: check
        run: |
          if git diff --name-only HEAD~ ${{ github.sha }} | grep '^charm/'; then
            echo "charm_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "charm_changed=false" >> "$GITHUB_OUTPUT"
          fi

  pack-rock:
    name: Pack Rock
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup rockcraft
        run: sudo snap install rockcraft --classic

      - name: Pack rock
        run: rockcraft pack

      - name: Upload rock
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.charm_name }}-rock
          path: ./*.rock

  pack-and-upload-charm:
    name: Pack and Upload Charm
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup charmcraft
        run: sudo snap install charmcraft --classic --channel=3.x/stable

      - name: Fetch libs
        run: |
          cd ./charm
          charmcraft fetch-libs

      - name: Pack charm
        run: charmcraft pack -v --project-dir ./charm

      - name: Upload charm to Charmhub
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: charmcraft upload ./*.charm

  publish-image-and-release-charm:
    name: Publish OCI Image and Release Charm
    runs-on: ubuntu-latest
    needs: [pack-rock, pack-and-upload-charm]
    if: always() && !failure()
    steps:
      - name: Get Rock
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.charm_name }}-rock

      - name: Set image URL
        id: set_image_url
        run: echo "image_url=ghcr.io/${GITHUB_REPOSITORY}:$(date +%s)-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        run: skopeo --insecure-policy copy oci-archive:$(ls *.rock) docker://${{ steps.set_image_url.outputs.image_url }} --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"

      - name: Pull image and get ID
        id: pull_image
        run: |
          docker pull ${{ steps.set_image_url.outputs.image_url }}
          IMAGE_ID=$(docker images --format "{{.ID}}" ${{ steps.set_image_url.outputs.image_url }})
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup charmcraft
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Upload OCI image resource
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: charmcraft upload-resource ${{ inputs.charm_name }} flask-app-image --image=${{ steps.pull_image.outputs.image_id }} --verbosity=trace

      - name: Attach resource to charm and release
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          revision_number=$(charmcraft revisions "${{ inputs.charm_name }}" | awk 'NR==2 {print $1}')
          resource_revision_number=$(charmcraft resource-revisions "${{ inputs.charm_name }}" flask-app-image | awk 'NR==2 {print $1}')
          charmcraft release "${{ inputs.charm_name }}" --channel=${{ inputs.channel }} --revision $revision_number --resource flask-app-image:$resource_revision_number
