name: marketplace-analytics
base: ubuntu@24.04
version: '0.1'
summary: Marketplace Analytics
description: Marketplace Analytics service
platforms:
  amd64:
  arm64:

extensions:
  - flask-framework

parts:
  flask-framework/install-app:
    prime:
      - flask/app/app.py
      - flask/app/config.py
      - flask/app/migrate.py
      - flask/app/models.py
      - flask/app/analytics
      - flask/app/auth
      - flask/app/static
      - flask/app/templates
      - flask/app/migrations

  flask-framework/dependencies:
    stage-packages:
      - libpq-dev
