services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketplace_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "9090:8080"
    environment:
      POSTGRESQL_DB_CONNECT_STRING: postgresql://postgres:postgres@db:5432/marketplace_analytics
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
